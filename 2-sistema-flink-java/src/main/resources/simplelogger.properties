# Que se ve en consola y que no.
# Esta clase simplifica el logging de Flink, que si no llena la pantalla.
#
# Flink habla por slf4j, y slf4j-simple decide aqui como se ve cada linea.
# En nivel "warn" solo pasan los avisos y los errores, que es lo que
# interesa: los cuatro [WARN] que imprime el job son del mini-cluster, que
# no tiene Kerberos ni dashboard web. Estan explicados en GUIA-FLINK.md.
#
# Si se sube a "info" salen tambien las lineas de cada operador, que
# sirven para ver como avanza el job, pero son varias pantallas.
#
# Este archivo lo lee slf4j-simple por su nombre y su ubicacion en el
# classpath, asi que Maven debe copiarlo a target\classes. Por eso esta en
# src/main/resources y no en la raiz del proyecto.

org.slf4j.simpleLogger.defaultLogLevel       = warn
org.slf4j.simpleLogger.log.org.apache.flink   = warn
org.slf4j.simpleLogger.showDateTime           = false
org.slf4j.simpleLogger.showThreadName         = false
org.slf4j.simpleLogger.showShortLogName       = true
org.slf4j.simpleLogger.levelInBrackets        = true
