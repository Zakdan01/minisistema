# ==========================================================================
#  Configuracion del job por lotes.
#  Esta dentro de src/main/resources para que Maven la copie a target/classes,
#  y por eso la lee con el classloader: Config.class.getResourceAsStream()
# ==========================================================================

# --- Conexion a MongoDB ---------------------------------------------------
mongo.uri              = mongodb://localhost:27017
mongo.base             = Mundo
mongo.coleccionPaises  = paises
mongo.coleccionResumen = resumen_regiones

# --- Apache Flink ---------------------------------------------------------
# Numero de subtareas. Cada una abre su propia conexion a MongoDB y procesa
# un tramo de los 250 paises. Sube esto a 8 en la defensa y cambia el reparto.
flink.paralelismo = 4

# --- Regla de negocio -----------------------------------------------------
# Un pais cuenta como grande si supera esta poblacion.
umbralPoblacionGrande = 50000000

# --- Como mostrar los resultados -----------------------------------------
#   true  = ademas de escribir en MongoDB, muestra el resultado en consola
#   false = solo escribe en MongoDB
mostrarResultadoConsola = true
